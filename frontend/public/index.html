<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark; background: #0E0904;">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1C1008" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="RightMove — play, learn and analyze chess with guided coaching and grandmaster training" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>RightMove</title>
  <style>
    :root, html, body {
      color-scheme: dark !important;
      scrollbar-color: #D4AF37 #0E0904 !important;
      scrollbar-width: thin !important;
      background: #0E0904 !important;
    }
    ::-webkit-scrollbar {
      width: 8px !important;
      height: 8px !important;
      background: #0E0904 !important;
    }
    ::-webkit-scrollbar-button {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    ::-webkit-scrollbar-track {
      background: #0E0904 !important;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4AF37 !important;
      border-radius: 9999px !important;
      border: 1px solid rgba(212, 175, 55, 0.4) !important;
    }
    ::-webkit-scrollbar-corner {
      background: #0E0904 !important;
    }
  </style>
</head>

<body data-theme="dark" style="color-scheme: dark; background: #0E0904;">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</body>

</html>
